# Quality gate.
#
# Not security scanning as such, but CodeQL's findings are only worth reading
# if the code compiles and the tests pass first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          # package.json asks for >=22; this pins what CI actually runs on.
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
