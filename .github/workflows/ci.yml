# Quality gate.
#
# Not security scanning as such, but CodeQL's findings are only worth reading
# if the code compiles and the tests pass first.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Nothing here needs to write to the repo.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          # package.json declares no `engines`, so the version lives here.
          # Matches the version this was developed against.
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc -b

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # The Electron target is deliberately absent: electron-builder needs a
      # Windows runner and several minutes, and nothing about it is verified
      # here that `vite build` has not already covered. Package installers
      # from a separate tag-triggered workflow if they are ever wanted.
